name: Build Warium Invasion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat > /tmp/wrapper-only.gradle <<'EOF'
          tasks.register('wrapper', Wrapper) {
              gradleVersion = '8.1.1'
              distributionType = Wrapper.DistributionType.BIN
          }
          EOF
            gradle -b /tmp/wrapper-only.gradle wrapper
          fi
      - name: Commit Gradle Wrapper
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            chmod +x gradlew
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            if ! git diff --cached --quiet; then
              git commit -m "Add Gradle Wrapper"
              git push
            fi
          fi
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: Warium-Invasion-1.20.1-Forge
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
